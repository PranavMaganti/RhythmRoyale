<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#091117" />
    <meta name="description" content="Design a pathogen and infect the world before it finds a cure." />
    <title>Contagion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&family=Saira+Condensed:wght@600;700;800&display=swap"
    />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Contagion" />
    <meta property="og:description" content="Evolve a strain and infect the world before the labs finish a cure." />
    <meta property="og:image" content="icon-512.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="map-data.js"></script>
    <script src="data.js"></script>
    <script src="sim.js"></script>
    <script src="render.js"></script>
    <script src="panels.js"></script>
    <script src="ui.js"></script>
    <script>
      // Offline support, and an installable icon on a phone home screen.
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
