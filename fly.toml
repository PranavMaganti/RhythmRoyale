# Fly.io, everything in one place: the game server plus Fly Managed Postgres
# for the daily leaderboard. See DEPLOY.md.
#
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly mpg create --region lhr
#   fly mpg attach <cluster-id> -a <your-app-name>   # sets the DATABASE_URL secret
#   fly deploy
app = "rhythm-royale"
primary_region = "lhr"

[env]
  PORT = "8080"
  # DATABASE_URL comes from a Fly secret (`fly mpg attach` sets it).

[http_service]
  internal_port = 8080
  force_https = true
  # Matches live in the server's memory, so keep exactly one machine running:
  # stopping it (or adding a second) would split or end games in progress.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
