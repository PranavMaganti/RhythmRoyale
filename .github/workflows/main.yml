name: build-test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: "**/yarn.lock"

      # The root install script installs every package and builds `common`,
      # which the backend and frontend link to.
      - name: Install dependencies
        run: yarn install

      - name: Lint common
        run: yarn --cwd common lint

      - name: Typecheck backend
        run: yarn --cwd backend typecheck

      - name: Run tests
        run: yarn test

      - name: Build
        run: CI=true yarn build
