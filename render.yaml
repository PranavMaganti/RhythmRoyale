# Render: New > Blueprint, pick this repository, and paste your Supabase
# connection string when asked for DATABASE_URL. See DEPLOY.md.
services:
  - type: web
    name: rhythm-royale
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
